name: Update wallpaper

on:
  schedule:
    # Daily at 04:00 UTC (~6am Amsterdam, ~5am winter). Adjust as needed.
    - cron: "0 4 * * *"
  workflow_dispatch:  # allow manual runs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install Pillow requests

      - name: Generate wallpaper
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallpaper.png
          git diff --staged --quiet || git commit -m "chore: update wallpaper $(date -u +%Y-%m-%d)"
          git push
